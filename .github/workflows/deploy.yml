name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update Latest Updates Date
        run: |
          export TZ="Asia/Ho_Chi_Minh"
          CURRENT_DATE=$(date +'%d. %m. %Y.')
          sed -i -E "s/<span className=\"hightlight-footer\"> ?[0-9]{1,2}\. [0-9]{1,2}\. [0-9]{4}\.<\/span>/<span className=\"hightlight-footer\"> $CURRENT_DATE<\/span>/g" src/widgets/Footer/ui/Footer.tsx

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_URL: ${{ secrets.VITE_FIREBASE_URL }}
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
